name: Update TrendRadar666

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0

      - name: Checkout crawler source
        uses: actions/checkout@v4
        with:
          repository: cclddk/TrendRadar666-source
          ref: master
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install crawler dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        working-directory: source
        env:
          GITHUB_ACTIONS: true
        run: python main.py

      - name: Copy generated site
        run: |
          mkdir -p site/TrendRadar666
          cp source/index.html site/TrendRadar666/index.html
          rm -rf site/TrendRadar666/output
          if [ -d source/output ]; then
            cp -R source/output site/TrendRadar666/output
          fi
          touch site/.nojekyll
          touch site/TrendRadar666/.nojekyll

      - name: Commit refreshed page
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TrendRadar666 .nojekyll
          if git diff --cached --quiet; then
            echo "No page changes to commit."
          else
            git commit -m "Update TrendRadar666 page"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4